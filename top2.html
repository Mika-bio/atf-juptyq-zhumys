<style>:root{--acc:#2e9e5b;--ink:#1f3a2d;--muted:#5d7468;--bg:#f2faf4;--card:#fff;--ok:#1c9c4f;--bad:#d64545;--line:#d7eadc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);line-height:1.5;
 background:radial-gradient(circle at 8% 4%,#e1f5e8 0,transparent 32%),radial-gradient(circle at 96% 12%,#e3f1fb 0,transparent 30%),var(--bg);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 60px}
header.hero{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));color:#fff;border-radius:22px;padding:20px 18px;margin:8px 0 12px;box-shadow:0 8px 22px rgba(0,0,0,.12);position:relative;overflow:hidden}
header.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.15)}
.tag{display:inline-block;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600}
.hero h1{margin:8px 0 2px;font-size:1.55rem;line-height:1.25}
.hero p{margin:0;opacity:.95}
.pair{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pair input{flex:1 1 150px;border:0;border-radius:12px;padding:10px 12px;font-size:1rem;font-family:inherit}
.scorebar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:8px 12px;margin:0 0 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.scorebar b{font-size:1.1rem;white-space:nowrap;color:var(--acc)}
.bar{flex:1;height:12px;background:#e6efe8;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8fd9a8);transition:width .4s}
details.recall{background:#fffbea;border:1px solid #f3e2a0;border-radius:16px;padding:10px 14px;margin-bottom:14px}
details.recall summary{cursor:pointer;font-weight:700}
details.recall ul{margin:8px 0 2px;padding-left:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(40,90,60,.07)}
.card h2{margin:0 0 4px;font-size:1.15rem;display:flex;gap:10px;align-items:center}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.role{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.task-score{margin-left:auto;font-size:.9rem;background:#eef7f0;border-radius:999px;padding:2px 10px;color:var(--acc);white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;min-height:44px}
.btn.alt{background:#eef3ef;color:var(--ink)}
.btn:active{transform:scale(.98)}
.fb{margin-top:10px;padding:8px 12px;border-radius:12px;font-size:.95rem;display:none}
.fb.show{display:block}.fb.good{background:#e5f7ec;color:#116a35}.fb.warn{background:#fdeceb;color:#9a2626}.fb.mid{background:#fff4dc;color:#8a5a00}
svg.atp{width:100%;height:auto;background:#fbfffc;border:1px dashed #bcdcc6;border-radius:14px}
.slots{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
@media(min-width:620px){.slots{grid-template-columns:1fr 1fr}}
.slotrow{display:flex;align-items:center;gap:8px}
.slotrow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.slot{flex:1;min-height:48px;border:2px dashed #a9cdb5;border-radius:12px;padding:4px;display:flex;align-items:center;background:#f8fdf9}
.slot:empty:before{content:"осы жерге қой";color:#9ab5a3;font-size:.85rem;padding:0 8px}
.slot.ok{border:2px solid var(--ok);background:#e9f8ee}.slot.bad{border:2px solid var(--bad);background:#fdeeee}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:14px;background:#eef7f0;min-height:54px}
.chip{background:#fff;border:2px solid #9fcdb0;border-radius:999px;padding:7px 12px;font-size:.92rem;cursor:grab;user-select:none;touch-action:manipulation;line-height:1.25}
.chip.sel{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,158,91,.25)}
.slot .chip{border-radius:10px;width:100%;text-align:left}
.hintline{font-size:.85rem;color:var(--muted);margin:6px 0}
.mrow{padding:10px 0;border-bottom:1px solid #edf4ee;display:grid;gap:6px}
.mrow:last-of-type{border-bottom:0}
select,input[type=text],input.num-in,textarea{font:inherit;border:2px solid #b7d8c3;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);max-width:100%}
select.ok,input.ok{border-color:var(--ok);background:#e9f8ee}select.bad,input.bad{border-color:var(--bad);background:#fdeeee}
.mrow select{width:100%}
.para{font-size:1.05rem;line-height:2.3}
.para select{margin:0 3px;padding:4px 8px;min-width:96px}
.bankline{font-size:.9rem;color:var(--muted);margin-bottom:8px}
.calc{padding:10px 0;border-bottom:1px solid #edf4ee}
.calc:last-of-type{border-bottom:0}
.calc input{width:110px;margin-right:6px}
.sol{display:none;font-size:.9rem;margin-top:6px;color:#116a35;background:#e5f7ec;border-radius:8px;padding:4px 10px}
.sol.show{display:block}
.sol.hint{color:#8a5a00;background:#fff4dc}
.tf{padding:10px 0;border-bottom:1px solid #edf4ee}
.tf:last-child{border-bottom:0}
.tfb{display:flex;gap:8px;margin-top:6px}
.tfb button{flex:1;max-width:160px;border:2px solid #b7d8c3;background:#fff;border-radius:12px;padding:8px;font-weight:700;min-height:44px}
.tfb button.chosen{background:#e6f1ff;border-color:#4b8fd8}
.tfb button.ok{background:#e9f8ee;border-color:var(--ok)}.tfb button.bad{background:#fdeeee;border-color:var(--bad)}
.why{display:none;font-size:.9rem;margin-top:6px;padding:6px 10px;border-radius:8px;background:#f3f7f4}
.why.show{display:block}
textarea{width:100%;min-height:110px;resize:vertical}
.keys label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:6px 0;border-radius:12px;background:#f4faf6;border:1px solid #dcebe0;cursor:pointer}
.keys input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--acc)}
.result{text-align:center;background:linear-gradient(135deg,#fff,#eefaf1);}
.result .big{font-size:2.6rem;font-weight:800;color:var(--acc)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
a.back{color:#fff;text-decoration:none;font-size:.9rem;opacity:.9}
/* index */
.cards{display:grid;gap:14px;margin-top:14px}
@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}}
a.gcard{display:block;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--c);border-radius:22px;padding:18px;box-shadow:0 6px 16px rgba(0,0,0,.08);transition:transform .15s}
a.gcard:hover{transform:translateY(-3px)}
a.gcard .em{font-size:2.4rem}
a.gcard h3{margin:4px 0;color:var(--c);font-size:1.4rem}
a.gcard span.go{display:inline-block;margin-top:8px;background:var(--c);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700}
