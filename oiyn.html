<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚡ АТФ сергіту ойыны</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f2b01e'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
:root{--red:#e21b3c;--blue:#1368ce;--yellow:#e0a100;--green:#26890c;--ink:#21313c;--t1:#2e9e5b;--t2:#1f8fb3;--t3:#d98a1b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);overflow:hidden;
 background:radial-gradient(circle at 10% 15%,#ffe9f0 0,transparent 30%),radial-gradient(circle at 90% 10%,#e3f1fb 0,transparent 32%),radial-gradient(circle at 85% 90%,#fff3cf 0,transparent 30%),radial-gradient(circle at 12% 88%,#e3f7e8 0,transparent 30%),#fbfcff}
#app{height:100%;display:flex;flex-direction:column;padding:1.2vh 1.6vw;gap:1.2vh}
.top{display:flex;align-items:center;gap:12px;min-height:6vh}
.brand{font-weight:800;font-size:clamp(1rem,1.8vw,1.6rem);color:#6a3fc4}
.qn:empty{display:none}.qn{margin-left:auto;background:#fff;border:2px solid #e5e9f5;border-radius:999px;padding:4px 16px;font-weight:700;font-size:clamp(.9rem,1.5vw,1.3rem)}
.iconbtn{border:2px solid #e5e9f5;background:#fff;border-radius:12px;font-size:1.2rem;padding:6px 10px;cursor:pointer}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.4vh}
.qcard{background:#fff;border:3px solid #e5e9f5;border-radius:24px;box-shadow:0 8px 24px rgba(60,60,120,.1);padding:2vh 2vw;display:flex;align-items:center;gap:20px;min-height:20vh}
.qtext{flex:1;font-weight:800;font-size:clamp(1.4rem,3.6vw,3.4rem);line-height:1.2;text-align:center}
.timer{flex:none;width:clamp(70px,10vw,130px);height:clamp(70px,10vw,130px);position:relative}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .bg{stroke:#e8ebf5}.timer .fg{stroke:#6a3fc4;transition:stroke .3s}
.timer.low .fg{stroke:var(--red)}
.timer b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.6rem,4vw,3.4rem);font-weight:800}
.timer.low b{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.2vw}
.tile{border-radius:20px;color:#fff;display:flex;align-items:center;gap:16px;padding:1vh 1.6vw;box-shadow:0 6px 0 rgba(0,0,0,.22);position:relative;transition:opacity .4s,transform .3s}
.tile .sh{flex:none;font-size:clamp(2rem,4.6vw,4.2rem);line-height:1;width:1.2em;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.tile .tx{font-weight:800;font-size:clamp(1.1rem,2.7vw,2.5rem);line-height:1.15}
.tile small{display:block;font-weight:600;font-size:.8rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.t0{background:var(--red)}.t1{background:var(--blue)}.t2{background:var(--yellow)}.t3{background:var(--green)}
.tile.dim{opacity:.22;transform:scale(.97)}
.tile.right{transform:scale(1.03);outline:6px solid #fff;box-shadow:0 0 0 10px rgba(38,137,12,.35),0 6px 0 rgba(0,0,0,.22);z-index:2}
.tile.right:after{content:"✔";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:clamp(2rem,5vw,4.5rem);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.expl{background:#fff9db;border:3px solid #ffe08a;border-radius:18px;padding:1.2vh 1.6vw;font-size:clamp(1rem,1.9vw,1.7rem);font-weight:600;display:none}
.expl.show{display:block;animation:pop .4s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.bottom{display:flex;flex-direction:column;gap:1vh}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw}
.team{background:#fff;border:3px solid var(--c);border-radius:18px;padding:.8vh 1vw;display:flex;align-items:center;gap:10px}
.team .nm{font-weight:800;color:var(--c);font-size:clamp(1rem,1.9vw,1.7rem)}
.team .sc{margin-left:auto;font-weight:800;font-size:clamp(1.2rem,2.4vw,2.2rem)}
.team .pl{font-size:.7em;color:var(--green)}
.team button{border:0;border-radius:12px;background:#eef1f8;color:var(--ink);font-weight:700;padding:8px 10px;cursor:pointer;font-size:clamp(.8rem,1.3vw,1.1rem);min-height:40px}
.team button.on{background:var(--c);color:#fff}
.team button:disabled{opacity:.35;cursor:default}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{border:0;border-radius:14px;padding:12px 22px;font-size:clamp(1rem,1.6vw,1.4rem);font-weight:800;color:#fff;background:#6a3fc4;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.o{background:#f2891e}.btn.g{background:var(--green)}.btn.b{background:var(--blue)}.btn.gr{background:#7b8794}
.btn:disabled{opacity:.35;cursor:default}
.kb{font-size:.78rem;opacity:.7;font-weight:600;margin-left:4px}
/* start / board / final */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;min-height:0;overflow:auto}
.title{font-size:clamp(2rem,6vw,5.2rem);font-weight:900;line-height:1.05}.gt,.title.g{background:linear-gradient(90deg,var(--red),#f2891e,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(1rem,2.2vw,2rem);font-weight:600}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2vh 1.4vw;max-width:1100px;width:100%;text-align:left}
.how div{background:#fff;border:3px solid #e5e9f5;border-radius:18px;padding:1.2vh 1.2vw;font-size:clamp(.9rem,1.6vw,1.45rem);font-weight:600}
.cards4{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cards4 span{color:#fff;font-weight:800;border-radius:12px;padding:6px 16px;font-size:clamp(1rem,1.8vw,1.6rem)}
.opts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:600;align-items:center}
.opts select{font:inherit;border:2px solid #cfd6ea;border-radius:10px;padding:4px 8px}
.keys{font-size:clamp(.75rem,1.2vw,1.05rem);color:#51606b;max-width:1100px}
.keys kbd{background:#fff;border:2px solid #d7dcec;border-bottom-width:4px;border-radius:7px;padding:0 7px;font-weight:700;font-family:inherit}
.bars{width:min(1000px,100%);display:flex;flex-direction:column;gap:1.6vh}
.bar{display:flex;align-items:center;gap:14px;transition:transform .6s}
.bar .rk{flex:none;font-size:clamp(1.6rem,3.6vw,3.2rem);width:1.4em}
.bar .nm{flex:none;width:clamp(80px,12vw,170px);text-align:left;font-weight:800;font-size:clamp(1.1rem,2.4vw,2.2rem);color:var(--c)}
.bar .tr{flex:1;background:#eceff8;border-radius:999px;height:clamp(34px,6vh,64px);overflow:hidden}
.bar .fl{height:100%;border-radius:999px;background:var(--c);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;color:#fff;font-weight:800;font-size:clamp(1rem,2vw,1.8rem);min-width:3.2em}
.bar .dl{flex:none;width:4.5em;font-weight:800;color:var(--green);font-size:clamp(1rem,2vw,1.8rem);text-align:left}
.podium{flex:none;display:flex;align-items:flex-end;justify-content:center;gap:2vw;height:42vh;width:min(900px,100%)}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pod .who{font-weight:900;font-size:clamp(1.2rem,3vw,2.6rem);color:var(--c)}
.pod .pt{font-weight:800;font-size:clamp(1rem,2vw,1.8rem)}
.pod .blk{overflow:hidden;width:100%;border-radius:18px 18px 0 0;background:var(--c);color:#fff;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(2rem,5vw,4.5rem);padding-top:8px;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.hidectl .bottom .ctrl{display:none}
@media(max-width:700px){.tiles{grid-template-columns:1fr}.how{grid-template-columns:1fr}.qcard{flex-direction:column}.team{flex-wrap:wrap}}
</style></head><body>
<div id="app">
 <div class="top"><span class="brand">⚡ АТФ сергіту ойыны</span><span class="qn" id="qn"></span>
  <button class="iconbtn" id="snd" title="Дыбыс (S)">🔊</button><button class="iconbtn" id="fs" title="Толық экран (F)">⛶</button></div>
 <div id="stage"></div>
 <div class="bottom" id="bottom"></div>
</div>
<canvas id="cf"></canvas>
<script>
(function(){
var TEAMS=[{n:"Топ 1",c:"#2e9e5b"},{n:"Топ 2",c:"#1f8fb3"},{n:"Топ 3",c:"#d98a1b"}];
var SHAPES=["▲","◆","●","■"],COLN=["Қызыл","Көк","Сары","Жасыл"];
var Q=[
 {e:"🧬",q:"АТФ-тің толық атауы қандай?",r:"Аденозинүшфосфор қышқылы",w:["Аденозинбірфосфор қышқылы","Гуанозинүшфосфор қышқылы","Аминүшфосфор қышқылы"],p:2,x:"АТФ — аденозинүшфосфор қышқылы: құрамында үш фосфат қалдығы бар нуклеотид."},
 {e:"🍬",q:"АТФ құрамындағы бес көміртекті қант қалай аталады?",r:"Рибоза",w:["Дезоксирибоза","Глюкоза","Фруктоза"],p:0,x:"АТФ құрамында рибоза бар. Дезоксирибоза — ДНҚ-ның қанты."},
 {e:"🔢",q:"АТФ молекуласында неше фосфор қышқылы қалдығы бар?",r:"Үш",w:["Бір","Екі","Төрт"],p:3,x:"АТФ = аденин + рибоза + 3 фосфат қалдығы."},
 {e:"🔗",q:"АТФ молекуласында неше макроэргиялық байланыс бар?",r:"Екеу",w:["Біреу","Үшеу","Төртеу"],p:1,x:"Макроэргиялық байланыстар фосфат қалдықтарының арасында орналасқан — екеу."},
 {e:"🔋",q:"1 моль АТФ → АДФ-ке дейін ыдырағанда шамамен қанша энергия бөлінеді?",r:"≈ 40 кДж",w:["≈ 4 кДж","≈ 400 кДж","≈ 4000 кДж"],p:0,x:"Мектеп курсында бір макроэргиялық байланыс үзілгенде ≈ 40 кДж/моль бөлінеді деп алынады."},
 {e:"🧮",q:"3 моль АТФ → АДФ-ке дейін ыдыраса, қанша энергия бөлінеді? (1 моль — 40 кДж)",r:"120 кДж",w:["40 кДж","80 кДж","240 кДж"],p:2,x:"3 моль × 40 кДж/моль = 120 кДж."},
 {e:"🏭",q:"АТФ негізінен қай органоидтарда түзіледі?",r:"Митохондрия мен хлоропласт",w:["Рибосома мен лизосома","Ядро мен Гольджи кешені","Вакуоль мен центриоль"],p:1,x:"Митохондрияда — органикалық заттардың тотығуы кезінде, хлоропластарда — жарық энергиясы есебінен."},
 {e:"⚡",q:"Қай органоидты «жасушаның энергия станциясы» деп атайды?",r:"Митохондрия",w:["Ядро","Рибосома","Лизосома"],p:3,x:"Митохондрияда АТФ көп түзіледі, сондықтан оны жасушаның энергия станциясы дейді."},
 {e:"🚫",q:"Төмендегілердің қайсысына АТФ энергиясы жұмсалмайды?",r:"Судың осмос арқылы мембрана арқылы өтуі",w:["Бұлшықеттің жиырылуы","Белсенді тасымалдау","Белок биосинтезі"],p:2,x:"Осмос — энергия жұмсамайтын пассивті процесс. Қалғандарына АТФ энергиясы қажет."},
 {e:"💧",q:"АТФ → АДФ реакциясында АТФ-ке қандай зат қосылады (гидролиз)?",r:"Су (H₂O)",w:["Оттегі (O₂)","Глюкоза","Көмірқышқыл газы (CO₂)"],p:1,x:"АТФ + H₂O → АДФ + H₃PO₄ + энергия."}
];
Q.forEach(function(q){q.o=q.w.slice();q.o.splice(q.p,0,q.r);q.c=q.p});
var $=function(s){return document.querySelector(s)};
var st={ph:"start",i:0,scores:[0,0,0],marks:[],delta:[0,0,0],dur:20,bonus:false,snd:true,left:20,paused:false,over:false,last:0,hide:false};
var BASE=100,BON=[50,30,10];
var timerId=null,ac=null;

/* sound */
function beep(f,d,t,v){if(!st.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function seq(a){a.forEach(function(x,k){setTimeout(function(){beep(x[0],x[1],x[2],x[3])},k*(x[4]||140))})}
function fanfare(){seq([[523,.2,"triangle"],[659,.2,"triangle"],[784,.2,"triangle"],[1047,.5,"triangle"]])}

/* timer */
function stopT(){clearInterval(timerId);timerId=null}
function startT(){stopT();st.left=st.dur;st.over=false;st.paused=false;st.last=performance.now();timerId=setInterval(tick,100);drawT()}
function tick(){if(st.paused||st.ph!=="question")return;var n=performance.now();st.left-=(n-st.last)/1000;st.last=n;
 var sec=Math.ceil(st.left);
 if(st.left<=0){st.left=0;st.over=true;stopT();seq([[200,.5,"sawtooth",.12]]);drawT();render(true);return}
 if(sec<=5&&sec!==tick.ps){beep(880,.08)}tick.ps=sec;drawT()}
function drawT(){var t=$("#tm");if(!t)return;var f=Math.max(0,st.left/st.dur);t.querySelector(".fg").style.strokeDashoffset=(1-f)*282.7;t.querySelector("b").textContent=st.over?"0":Math.ceil(st.left);t.classList.toggle("low",st.left<=5)}

/* helpers */
function pts(){var p=[0,0,0];st.marks.forEach(function(t,k){p[t]=BASE+(st.bonus?(BON[k]||0):0)});return p}
function teamsHTML(canMark){var p=pts();return '<div class="teams">'+TEAMS.map(function(t,k){var on=st.marks.indexOf(k)>=0;
 return '<div class="team" style="--c:'+t.c+'"><span class="nm">'+t.n+'</span><span class="sc">'+st.scores[k]+(on&&canMark?' <span class="pl">+'+p[k]+'</span>':'')+'</span>'+
 (canMark?'<button data-t="'+k+'" class="'+(on?"on":"")+'">'+(on?"✔ Дұрыс":"Дұрыс?")+' <span class="kb">'+(k+1)+'</span></button>':'')+'</div>'}).join("")+'</div>'}
function ctrlHTML(){var ph=st.ph,h="";
 if(ph==="start")h+='<button class="btn g" data-a="go">▶ Бастау <span class="kb">Space</span></button>';
 if(ph==="question"){h+='<button class="btn o" data-a="pause">'+(st.paused?"▶ Жалғастыру":"⏸ Уақытты тоқтату")+' <span class="kb">P</span></button><button class="btn b" data-a="reveal">👁 Жауапты көрсету <span class="kb">A</span></button>'}
 if(ph==="answer")h+='<button class="btn g" data-a="next">➡ Келесі <span class="kb">N</span></button>';
 if(ph==="board")h+='<button class="btn g" data-a="next">'+(st.i>=Q.length-1?"🏆 Қорытынды":"➡ Келесі сұрақ")+' <span class="kb">N</span></button>';
 if(ph==="final")h+='<button class="btn o" data-a="restart">↺ Басынан бастау <span class="kb">R</span></button>';
 return '<div class="ctrl">'+h+'</div>'}

/* render */
function render(keep){
 var ph=st.ph,S=$("#stage"),B=$("#bottom");document.body.classList.toggle("hidectl",st.hide);
 $("#qn").textContent=(ph==="start"||ph==="final")?"":("Сұрақ "+(st.i+1)+" / "+Q.length);
 $("#snd").textContent=st.snd?"🔊":"🔇";
 if(ph==="start"){
  S.innerHTML='<div class="center"><div class="title g">АТФ сергіту ойыны</div><div class="sub">⚡ Жасуша энергиясы туралы жылдам викторина · '+Q.length+' сұрақ · ~5 минут</div>'+
  '<div class="cards4"><span style="background:var(--red)">▲ Қызыл</span><span style="background:var(--blue)">◆ Көк</span><span style="background:var(--yellow)">● Сары</span><span style="background:var(--green)">■ Жасыл</span></div>'+
  '<div class="how"><div>📣 <b>Мұғалім</b> сұрақты оқиды, '+'<span id="durtxt">'+st.dur+'</span> секунд беріледі.</div><div>🙋 <b>Топтар</b> жауапты түсті карточкамен немесе қол көтеріп көрсетеді (құрылғы не логин керек емес).</div><div>✅ Мұғалім дұрыс жауап берген топтарды белгілейді: әр дұрыс жауап — '+BASE+' ұпай.</div><div>🏆 Ең көп ұпай жинаған топ жеңеді!</div></div>'+
  '<div class="opts"><label>⏱ Уақыт: <select id="dur"><option>10</option><option>15</option><option>20</option><option>30</option></select> с</label><label><input type="checkbox" id="bon"> Жылдамдық бонусы (+50/+30/+10: белгілеу ретімен)</label></div>'+
  '<div class="keys"><kbd>Space</kbd> келесі әрекет · <kbd>P</kbd> уақытты тоқтату/жалғастыру · <kbd>A</kbd> жауапты көрсету · <kbd>N</kbd> келесі · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> топтың дұрыс жауабын белгілеу · <kbd>S</kbd> дыбыс · <kbd>F</kbd> толық экран · <kbd>H</kbd> батырмаларды жасыру · <kbd>R</kbd> басынан бастау</div></div>';
  $("#dur").value=st.dur;$("#bon").checked=st.bonus;
  $("#dur").onchange=function(){st.dur=+this.value;$("#durtxt").textContent=st.dur};$("#bon").onchange=function(){st.bonus=this.checked};
  B.innerHTML=teamsHTML(false)+ctrlHTML();
 }else if(ph==="question"||ph==="answer"){
  var q=Q[st.i],rev=ph==="answer";
  if(!keep||!$("#tm")){
   S.innerHTML='<div class="qcard"><div class="qtext">'+q.e+' '+q.q+'</div><div class="timer" id="tm"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45" fill="none" stroke-width="9"/><circle class="fg" cx="50" cy="50" r="45" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"/></svg><b></b></div></div>'+
   '<div class="tiles">'+q.o.map(function(o,k){return '<div class="tile t'+k+'"><span class="sh">'+SHAPES[k]+'</span><span class="tx"><small>'+COLN[k]+'</small>'+o+'</span></div>'}).join("")+'</div><div class="expl" id="ex">💡 '+q.x+'</div>';
  }
  var tl=S.querySelectorAll(".tile");tl.forEach(function(t,k){t.classList.toggle("right",rev&&k===q.c);t.classList.toggle("dim",rev&&k!==q.c)});
  $("#ex").classList.toggle("show",rev);
  if(rev){$("#tm").querySelector("b").textContent="✔";$("#tm").classList.remove("low")}else drawT();
  if(st.over&&!rev){$("#tm").querySelector("b").textContent="⏰"}
  B.innerHTML=teamsHTML(true)+ctrlHTML();
 }else if(ph==="board"){
  var order=[0,1,2].sort(function(a,b){return st.scores[b]-st.scores[a]});var mx=Math.max.apply(null,st.scores.concat([1]));
  S.innerHTML='<div class="center"><div class="title" style="font-size:clamp(1.8rem,4.5vw,4rem)">🏅 <span class="gt">Жетекші топтар</span></div><div class="bars">'+order.map(function(k,r){return '<div class="bar" style="--c:'+TEAMS[k].c+'"><span class="rk">'+["🥇","🥈","🥉"][r]+'</span><span class="nm">'+TEAMS[k].n+'</span><div class="tr"><div class="fl" data-w="'+(100*st.scores[k]/mx)+'">'+st.scores[k]+'</div></div><span class="dl">'+(st.delta[k]?'+'+st.delta[k]:'')+'</span></div>'}).join("")+'</div></div>';
  setTimeout(function(){S.querySelectorAll(".fl").forEach(function(f){f.style.width=Math.max(8,f.dataset.w)+"%"})},60);
  B.innerHTML=ctrlHTML();
 }else if(ph==="final"){
  var o=[0,1,2].sort(function(a,b){return st.scores[b]-st.scores[a]});var hs={0:"27vh",1:"20vh",2:"14vh"};
  var ord=[o[1],o[0],o[2]],rk=[1,0,2];
  var tie=st.scores[o[0]]===st.scores[o[1]];
  S.innerHTML='<div class="center"><div class="title">🏆 <span class="gt">Жеңімпаз'+(tie?'тар':'')+'!</span></div><div class="podium">'+ord.map(function(k,j){var r=rk[j];return '<div class="pod" style="--c:'+TEAMS[k].c+'"><div class="who">'+TEAMS[k].n+'</div><div class="pt">'+st.scores[k]+' ұпай</div><div class="blk" data-h="'+hs[r]+'">'+["🥇","🥈","🥉"][r]+'</div></div>'}).join("")+'</div><div class="sub">'+(tie?'Тең ұпай! Бәріңе рақмет — тамаша ойнадыңдар! 🎉':'Құттықтаймыз, '+TEAMS[o[0]].n+'! Бәріңе рақмет — тамаша ойнадыңдар! 🎉')+'</div></div>';
  setTimeout(function(){S.querySelectorAll(".blk").forEach(function(b){b.style.height=b.dataset.h})},80);
  B.innerHTML=ctrlHTML();confetti();fanfare();
 }
}

/* actions */
function go(){st.ph="question";st.i=0;st.scores=[0,0,0];st.marks=[];st.delta=[0,0,0];render();startT();beep(660,.15)}
function askQ(){st.ph="question";st.marks=[];render();startT()}
function reveal(){if(st.ph!=="question")return;stopT();st.ph="answer";render();beep(784,.25,"triangle")}
function commit(){var p=pts();st.delta=p.slice();for(var k=0;k<3;k++)st.scores[k]+=p[k]}
function next(){
 if(st.ph==="question"){reveal();return}
 if(st.ph==="answer"){commit();st.ph="board";render();return}
 if(st.ph==="board"){if(st.i>=Q.length-1){st.ph="final";render()}else{st.i++;askQ()}}
}
function pause(){if(st.ph!=="question"||st.over)return;st.paused=!st.paused;st.last=performance.now();render(true)}
function mark(k){if(st.ph!=="question"&&st.ph!=="answer")return;var ix=st.marks.indexOf(k);if(ix>=0)st.marks.splice(ix,1);else{st.marks.push(k);beep(600,.1,"triangle")}render(true)}
function restart(){if(st.ph!=="start"&&!confirm("Ойын басынан басталады. Жалғастырасыз ба?"))return;stopT();st.ph="start";st.i=0;st.scores=[0,0,0];st.marks=[];st.delta=[0,0,0];stopConf();render()}
function fs(){var d=document;if(!d.fullscreenElement)(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);else d.exitFullscreen()}
function act(a){({go:go,next:next,reveal:reveal,pause:pause,restart:restart})[a]&&({go:go,next:next,reveal:reveal,pause:pause,restart:restart})[a]()}

document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b){act(b.dataset.a);return}var t=e.target.closest("[data-t]");if(t)mark(+t.dataset.t)});
$("#snd").onclick=function(){st.snd=!st.snd;render(true)};$("#fs").onclick=fs;
document.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;if(e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key.toLowerCase();
 if(k===" "||k==="enter"){e.preventDefault();if(st.ph==="start")go();else if(st.ph==="final")restart();else next()}
 else if(k==="p"||k==="з")pause();else if(k==="a"||k==="ф")reveal();else if(k==="n"||k==="т"){if(st.ph==="question")reveal();else if(st.ph!=="start"&&st.ph!=="final")next()}
 else if(k==="1"||k==="2"||k==="3")mark(+k-1);else if(k==="s"||k==="ы"){st.snd=!st.snd;render(true)}
 else if(k==="f"||k==="а")fs();else if(k==="h"||k==="һ"){st.hide=!st.hide;render(true)}else if(k==="r"||k==="к")restart()});

/* confetti */
var cf=$("#cf"),cx=cf.getContext("2d"),parts=[],raf=null;
function size(){cf.width=innerWidth;cf.height=innerHeight}size();addEventListener("resize",size);
function confetti(){var cols=["#e21b3c","#1368ce","#e0a100","#26890c","#6a3fc4","#f2891e"];parts=[];for(var i=0;i<220;i++)parts.push({x:Math.random()*cf.width,y:-Math.random()*cf.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:5+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[i%cols.length]});
 cancelAnimationFrame(raf);(function loop(){cx.clearRect(0,0,cf.width,cf.height);var alive=0;parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.y<cf.height+20)alive++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.6);cx.restore()});if(alive)raf=requestAnimationFrame(loop);else cx.clearRect(0,0,cf.width,cf.height)})()}
function stopConf(){cancelAnimationFrame(raf);cx.clearRect(0,0,cf.width,cf.height)}
window.__game={st:st,Q:Q};
render();
})();
</script></body></html>
