<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нөмірлі жасырын терезелер ойыны · АТФ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#26324a;--t1:#2e9e5b;--t2:#1f8fb3;--t3:#d98a1b}
html,body{height:100%}
body{font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(900px 500px at 8% 0,#ffe9ef 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#fff3d9 0,transparent 60%),#f7faff}
button{font:inherit;cursor:pointer;border:0}
header{display:flex;align-items:center;gap:2vw;padding:1.4vh 2vw 0.6vh}
h1{font-size:clamp(1rem,2.2vw,1.9rem);font-weight:900;white-space:nowrap}
.score{flex:1;display:flex;gap:1.2vw}
.team{flex:1;display:flex;align-items:center;justify-content:space-between;background:#fff;border:.45vh solid var(--c);border-radius:16px;padding:.6vh 1.4vw;position:relative;transition:transform .2s,box-shadow .2s}
.team b{color:var(--c);font-size:clamp(1rem,2.2vw,2rem)}
.team span{font-size:clamp(1.6rem,3.8vw,3.4rem);font-weight:900;line-height:1}
.team.on{background:var(--c);transform:scale(1.04);box-shadow:0 .8vh 2vh rgba(0,0,0,.2)}
.team.on b,.team.on span{color:#fff}
.team.on::after{content:"кезек";position:absolute;top:-1.2vh;left:50%;transform:translateX(-50%);background:#26324a;color:#fff;font-size:clamp(.6rem,1vw,.9rem);font-weight:800;padding:.1vh 10px;border-radius:99px}
.tools{display:flex;gap:.6vw}
.tools button{background:#fff;border:2px solid #d7dcec;border-radius:12px;padding:.7vh .9vw;font-size:clamp(.8rem,1.3vw,1.2rem);font-weight:700;color:var(--ink)}
.tools button:hover{background:#eef2fb}
.hint{text-align:center;font-size:clamp(.9rem,1.7vw,1.5rem);font-weight:700;color:#5b6783;padding:.4vh 2vw 1vh}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.8vh 1.6vw;padding:0 2vw 2.4vh}
.win{position:relative;border-radius:22px;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;
box-shadow:0 .9vh 0 rgba(0,0,0,.18);transition:transform .15s,filter .3s,opacity .3s;overflow:hidden;font-size:min(15vh,11vw)}
.win::before{content:"";position:absolute;inset:7% 8%;border:.7vh solid rgba(255,255,255,.55);border-radius:14px;
background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) center/.6vh 100% no-repeat,linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) center/100% .6vh no-repeat,linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.05))}
.win i{position:relative;font-style:normal;text-shadow:0 .5vh 0 rgba(0,0,0,.2);background:var(--c);border-radius:50%;width:1.35em;height:1.35em;display:flex;align-items:center;justify-content:center;font-size:.8em;box-shadow:0 0 0 .6vh rgba(255,255,255,.7)}
.win:hover:not(.done){transform:translateY(-.6vh) scale(1.03)}
.win.done{filter:grayscale(1);opacity:.42;cursor:default;box-shadow:none}
.win.done i::after{content:"✔";position:absolute;right:-.15em;top:-.25em;font-size:.45em;background:#2e9e5b;color:#fff;border-radius:50%;width:1.3em;height:1.3em;display:flex;align-items:center;justify-content:center;filter:none}
.chips{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-size:clamp(.7rem,1.3vw,1.1rem);display:flex;gap:4px;justify-content:center}
.chips em{font-style:normal;background:#fff;color:#26324a;border-radius:99px;padding:0 .6em;font-weight:800}
/* modal */
#ov{position:fixed;inset:0;background:rgba(38,50,74,.55);display:none;align-items:center;justify-content:center;perspective:1600px;z-index:5}
#ov.show{display:flex}
.card{width:min(1100px,94vw);max-height:94vh;background:#fff;border-radius:28px;border:1vh solid var(--c);padding:2.4vh 3vw;display:flex;flex-direction:column;gap:2vh;animation:flip .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 3vh 8vh rgba(0,0,0,.35);overflow:auto}
@keyframes flip{from{transform:rotateY(90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;align-items:center;gap:1.5vw}
.num{background:var(--c);color:#fff;border-radius:18px;font-weight:900;font-size:clamp(1.6rem,4.5vw,3.6rem);min-width:1.5em;text-align:center;padding:0 .25em}
.tag{font-size:clamp(1rem,2vw,1.7rem);font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.q{font-size:clamp(1.6rem,4.2vw,3.6rem);font-weight:800;line-height:1.2;text-align:center;padding:1vh 0}
.ans{font-size:clamp(1.5rem,3.6vw,3rem);font-weight:900;color:#1e7a44;background:#e4f7ec;border:.5vh solid #2e9e5b;border-radius:20px;padding:1.6vh 1.6vw;text-align:center;line-height:1.2;animation:pop .35s}
.ans small{display:block;font-size:.5em;font-weight:700;color:#3d6b52;margin-top:.5vh}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center}
.big{font-size:clamp(1.2rem,2.6vw,2.2rem);font-weight:900;border-radius:18px;padding:1.6vh 2.4vw;color:#fff;box-shadow:0 .6vh 0 rgba(0,0,0,.2);position:relative}
.big:active{transform:translateY(.4vh)}
.big.rev{background:#f26b1d}
.big.close{background:#5b6783}
.big.t{background:var(--c)}
.big.on{outline:.8vh solid #26324a}
.big.on::after{content:"✔";position:absolute;top:-1.4vh;right:-1vw;background:#26324a;color:#fff;border-radius:50%;width:1.6em;height:1.6em;font-size:.7em;display:flex;align-items:center;justify-content:center}
.big[disabled]{opacity:.35;cursor:not-allowed}
.note{text-align:center;font-size:clamp(1rem,1.8vw,1.5rem);font-weight:700;color:#5b6783}
/* final */
#fin{position:fixed;inset:0;background:radial-gradient(900px 500px at 50% 0,#fff3c4 0,transparent 70%),#f7faff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;z-index:8;text-align:center;padding:2vh}
#fin.show{display:flex}
#fin h2{font-size:clamp(2rem,6vw,5rem);font-weight:900}
#fin .w{font-size:clamp(1.6rem,4vw,3.4rem);font-weight:900}
.pod{display:flex;gap:2vw;align-items:flex-end;justify-content:center;width:min(900px,95vw)}
.pc{flex:1;border-radius:20px 20px 0 0;background:var(--c);color:#fff;padding:1.4vh 1vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-weight:900}
.pc b{font-size:clamp(1.2rem,2.6vw,2.2rem)}.pc span{font-size:clamp(2rem,5vw,4.2rem);line-height:1.1}.pc small{font-size:clamp(.9rem,1.6vw,1.3rem);font-weight:700}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (orientation:portrait){#grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}header{flex-wrap:wrap}h1{width:100%;white-space:normal}.win{font-size:min(12vh,18vw)}}
</style>
</head>
<body>
<header>
  <h1>🪟 Нөмірлі жасырын терезелер</h1>
  <div class="score" id="score"></div>
  <div class="tools"><button id="bRes" title="Нәтижені көрсету">🏁 Нәтиже</button><button id="bRst" title="Басынан бастау">↺</button></div>
</header>
<div class="hint">Кезектегі топ нөмірді таңдайды — мұғалім терезені басып ашады.</div>
<main id="grid"></main>
<div id="ov"></div>
<div id="fin"></div>
<canvas id="cf"></canvas>
<script>
(function(){
var TEAMS=[{n:"Топ 1",c:"#2e9e5b"},{n:"Топ 2",c:"#1f8fb3"},{n:"Топ 3",c:"#d98a1b"}];
var COLS=["#e5334f","#1f6fd1","#e0a000","#2a9a2a","#8a4fd6","#f26b1d","#0aa5a0","#d6368f","#4b6cdf","#7cab12","#c94b2a","#1b8c6a"];
var ITEMS=[
 {k:"q",tag:"Сұрақ",q:"АТФ-тің толық атауы қандай?",a:"Аденозинүшфосфор қышқылы"},
 {k:"q",tag:"Сұрақ",q:"АТФ құрамындағы бес көміртекті қант қалай аталады?",a:"Рибоза"},
 {k:"q",tag:"Сұрақ",q:"АТФ құрамындағы азотты негіз қалай аталады?",a:"Аденин"},
 {k:"q",tag:"Сұрақ",q:"АТФ молекуласында неше фосфат қалдығы бар?",a:"Үш (3) фосфат қалдығы"},
 {k:"q",tag:"Дұрыс па, бұрыс па?",q:"АТФ құрамында дезоксирибоза қанты бар.",a:"БҰРЫС ✗",s:"АТФ құрамында дезоксирибоза емес, рибоза бар."},
 {k:"q",tag:"Дұрыс па, бұрыс па?",q:"АТФ молекуласында екі макроэргиялық байланыс бар.",a:"ДҰРЫС ✔",s:"Олар фосфат қалдықтарының арасында орналасқан."},
 {k:"q",tag:"Дұрыс па, бұрыс па?",q:"АТФ тек митохондрияда ғана түзіледі.",a:"БҰРЫС ✗",s:"АТФ хлоропластарда да, цитоплазмада да (гликолиз) түзіледі."},
 {k:"q",tag:"Сұрақ",q:"1 моль АТФ АДФ-қа дейін ыдырағанда шамамен қанша энергия бөлінеді?",a:"≈ 40 кДж",s:"Мектеп оқулығындағы жуық мән."},
 {k:"q",tag:"Сұрақ",q:"Жасушаның «энергия станциясы» деп қай органоидты атайды?",a:"Митохондрия"},
 {k:"bonus"},{k:"move"},{k:"give"}
];
var S={wins:[],open:null,rev:false,applied:[],scores:[0,0,0],turn:0,done:0};
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function init(){
  var it=shuffle(ITEMS.slice());
  S.wins=it.map(function(x,i){return {it:x,done:false,teams:[],c:COLS[i%COLS.length]}});
  S.open=null;S.rev=false;S.applied=[];S.scores=[0,0,0];S.turn=0;S.done=0;
  $("fin").className="";$("ov").className="";
  clearConf();render();
}
function render(){
  $("score").innerHTML=TEAMS.map(function(t,k){return '<div class="team'+(S.turn===k?' on':'')+'" style="--c:'+t.c+'"><b>'+t.n+'</b><span>'+S.scores[k]+'</span></div>'}).join("");
  $("grid").innerHTML=S.wins.map(function(w,i){
    return '<button class="win'+(w.done?' done':'')+'" style="--c:'+w.c+'" data-i="'+i+'" aria-label="Терезе '+(i+1)+'"><i>'+(i+1)+'</i>'+(w.done&&w.teams.length?'<span class="chips">'+w.teams.map(function(k){return '<em>Т'+(k+1)+'</em>'}).join("")+'</span>':'')+'</button>';
  }).join("");
}
function buttons(w){
  var it=w.it,b=[];
  if(it.k==="q"){TEAMS.forEach(function(t,k){var d=[0,0,0];d[k]=1;b.push({l:t.n+" +1",team:k,d:d,c:t.c})})}
  else if(it.k==="bonus"){TEAMS.forEach(function(t,k){var d=[0,0,0];d[k]=2;b.push({l:t.n+" +2",team:k,d:d,c:t.c})})}
  else if(it.k==="give"){var g=S.turn,r=(g+1)%3,d=[0,0,0];d[g]=-1;d[r]=1;b.push({l:"🤝 "+TEAMS[g].n+" ➜ "+TEAMS[r].n+" (1 ұпай)",team:r,d:d,c:"#6a3fc4",giver:g})}
  else b.push({l:"✔ Орындалды",team:-1,d:[0,0,0],c:"#2e9e5b"});
  return b;
}
function openWin(i){
  if(S.open!==null||S.wins[i].done)return;
  S.open=i;S.rev=false;S.applied=[];showCard();
}
function showCard(){
  var i=S.open,w=S.wins[i],it=w.it,h="";
  h+='<div class="card" style="--c:'+w.c+'"><div class="top"><div class="num">'+(i+1)+'</div><div class="tag">';
  if(it.k==="q")h+=esc(it.tag);else if(it.k==="bonus")h+="Сюрприз";else if(it.k==="move")h+="Сюрприз";else h+="Сюрприз";
  h+='</div></div>';
  if(it.k==="q"){
    h+='<div class="q">'+esc(it.q)+'</div>';
    if(S.rev)h+='<div class="ans">'+esc(it.a)+(it.s?'<small>'+esc(it.s)+'</small>':'')+'</div>';
  }else if(it.k==="bonus"){
    h+='<div class="q">🎁 Бонус +2!</div><div class="note">Кезектегі топ 2 ұпай алады. Ұпайды төмендегі батырмамен беріңіз.</div>';
  }else if(it.k==="move"){
    h+='<div class="q">🤸 Сергіту: 5 рет отырып-тұр!</div><div class="note">Барлығы бірге орындаймыз.</div>';
  }else{
    var g=S.turn,r=(g+1)%3;
    h+='<div class="q">🤝 Ұпайды көршіге бер!</div><div class="note">'+TEAMS[g].n+' өз ұпайының біреуін келесі топқа ('+TEAMS[r].n+') береді.'+(S.scores[g]<1&&S.applied.indexOf(0)<0?' Қазір ұпай жоқ — ештеңе өзгермейді.':'')+'</div>';
  }
  h+='<div class="row">';
  if(it.k==="q"&&!S.rev)h+='<button class="big rev" id="bRev">👁 Жауап</button>';
  if(it.k!=="q"||S.rev){
    buttons(w).forEach(function(b,j){
      var on=S.applied.indexOf(j)>=0,dis=b.giver!==undefined&&!on&&S.scores[b.giver]<1;
      h+='<button class="big t'+(on?' on':'')+'" style="--c:'+b.c+'" data-b="'+j+'"'+(dis?' disabled':'')+'>'+esc(b.l)+'</button>';
    });
  }
  h+='<button class="big close" id="bClose">Жабу ✕</button></div></div>';
  $("ov").innerHTML=h;$("ov").className="show";
}
function toggle(j){
  var w=S.wins[S.open],b=buttons(w)[j],p=S.applied.indexOf(j);
  if(p>=0){S.applied.splice(p,1);b.d.forEach(function(v,k){S.scores[k]-=v})}
  else{
    if(b.giver!==undefined&&S.scores[b.giver]<1)return;
    S.applied.push(j);b.d.forEach(function(v,k){S.scores[k]+=v});
  }
  render();showCardKeep();
}
function showCardKeep(){var c=$("ov").firstChild;var s=c&&c.style.animation;showCard();var n=$("ov").firstChild;if(n)n.style.animation="none"}
function reveal(){if(S.open===null||S.rev||S.wins[S.open].it.k!=="q")return;S.rev=true;showCard()}
function closeWin(){
  if(S.open===null)return;
  var w=S.wins[S.open],bs=buttons(w);
  w.done=true;w.teams=[];
  S.applied.forEach(function(j){var t=bs[j].team;if(t>=0&&w.teams.indexOf(t)<0)w.teams.push(t)});
  S.open=null;S.rev=false;S.applied=[];S.done++;
  S.turn=(S.turn+1)%3;
  $("ov").className="";render();
  if(S.done>=S.wins.length)setTimeout(final,500);
}
function final(){
  var o=[0,1,2].sort(function(a,b){return S.scores[b]-S.scores[a]});
  var top=S.scores[o[0]],win=o.filter(function(k){return S.scores[k]===top});
  var hs=["34vh","27vh","21vh"];
  var h='<h2>🏆 '+(win.length>1?'Жеңімпаздар!':'Жеңімпаз!')+'</h2><div class="w" style="color:'+(win.length===1?TEAMS[win[0]].c:'#26324a')+'">'+win.map(function(k){return TEAMS[k].n}).join(" және ")+' — '+top+' ұпай</div><div class="pod">';
  var ord=[o[1],o[0],o[2]],hh=[hs[1],hs[0],hs[2]],md=["🥈","🥇","🥉"];
  h+=ord.map(function(k,j){return '<div class="pc" style="--c:'+TEAMS[k].c+';height:'+hh[j]+'"><small>'+md[j]+'</small><b>'+TEAMS[k].n+'</b><span>'+S.scores[k]+'</span></div>'}).join("");
  h+='</div><div class="row"><button class="big close" id="bBack">← Тақтаға оралу</button><button class="big rev" id="bAgain">↺ Басынан бастау</button></div>';
  $("fin").innerHTML=h;$("fin").className="show";confetti();
}
/* confetti */
var cf,cx,parts=[],raf=null;
function clearConf(){parts=[];if(cx)cx.clearRect(0,0,cf.width,cf.height);if(raf){cancelAnimationFrame(raf);raf=null}}
function confetti(){
  cf=$("cf");cx=cf.getContext("2d");cf.width=innerWidth;cf.height=innerHeight;parts=[];
  for(var i=0;i<180;i++)parts.push({x:Math.random()*cf.width,y:-Math.random()*cf.height,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,s:6+Math.random()*8,r:Math.random()*6,vr:-.2+Math.random()*.4,c:COLS[i%COLS.length]});
  (function loop(){cx.clearRect(0,0,cf.width,cf.height);parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>cf.height+20){p.y=-10;p.x=Math.random()*cf.width}cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});raf=requestAnimationFrame(loop)})();
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("win"))openWin(+t.dataset.i);
  else if(t.id==="bRev")reveal();
  else if(t.id==="bClose")closeWin();
  else if(t.dataset.b!==undefined)toggle(+t.dataset.b);
  else if(t.id==="bRes")final();
  else if(t.id==="bRst"||t.id==="bAgain"){if(S.done===0||S.done>=S.wins.length||confirm("Ойынды басынан бастаймыз ба?"))init()}
  else if(t.id==="bBack"){$("fin").className="";clearConf()}
});
document.addEventListener("keydown",function(e){
  if($("fin").className==="show")return;
  var k=e.key;
  if(S.open===null)return;
  if(k===" "||k==="Enter"){e.preventDefault();reveal()}
  else if(k==="Escape")closeWin();
  else if((k==="1"||k==="2"||k==="3")&&(S.rev||S.wins[S.open].it.k==="bonus")){toggle(+k-1)}
});
window.__game={S:S,ITEMS:ITEMS,open:openWin,reveal:reveal,close:closeWin,toggle:toggle,init:init};
init();
})();
</script>
</body>
</html>
